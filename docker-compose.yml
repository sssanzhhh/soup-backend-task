x-app-db-url: &app-db-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}


services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment: *app-db-url
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.worker
    environment: *app-db-url
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 4

  db:
    image: postgres:16
    container_name: soup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
